name: iOS sideload build

on:
  push:
    branches: ['feat/display-settings-weather-0.3.2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sideload-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec platforms/ios/project.yml
      - name: Build unsigned IPA for re-signing
        run: scripts/ios/build_sideload_ipa.sh
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MOTO-GPS-unsigned-IPA
          path: |
            build/sideload/*.ipa
            build/sideload/SHA256SUMS.txt
          if-no-files-found: error
